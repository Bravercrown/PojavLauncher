name: Android CI

on:
  pull_request:
    types: [ opened, reopened ]
  push:
    branches:
      - 'v3_openjdk'
      - 'controller-support'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          mkdir -p app_pojavlauncher/libs
          wget -q -O app_pojavlauncher/libs/ltw-release.aar https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Fetch and Bundle Java Runtimes (JRE 8, 17, 21)
        run: |
          mkdir -p /tmp/jre_dl /tmp/extracted app_pojavlauncher/src/main/assets/components
          wget -q https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk -O /tmp/jre_dl/PojavLauncher.apk
          unzip -q /tmp/jre_dl/PojavLauncher.apk 'assets/components/jre*' -d /tmp/extracted
          cp -r /tmp/extracted/assets/components/jre app_pojavlauncher/src/main/assets/components/
          cp -r /tmp/extracted/assets/components/jre-new app_pojavlauncher/src/main/assets/components/
          cp -r /tmp/extracted/assets/components/jre-21 app_pojavlauncher/src/main/assets/components/
          ls -la app_pojavlauncher/src/main/assets/components/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/pojavlauncher-controller-debug.apk
          md5sum out/pojavlauncher-controller-debug.apk > out/pojavlauncher-controller-debug.md5

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pojavlauncher-controller-apk
          path: out/pojavlauncher-controller-debug.*

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v3-controller
          name: "PojavLauncher Controller Edition (Full Runtimes APK)"
          body: |
            ### PojavLauncher Controller Edition - Vollständige Android APK
            
            Vollwertige Android-APK mit integrierten **Java-Runtimes (JRE 8, 17 und 21)** und allen Controller-Optimierungen.
            
            #### Enthaltene Runtimes:
            - **Java 8 (Internal)**: Für klassische Minecraft-Versionen (1.8 bis 1.16.5)
            - **Java 17 (Internal-17)**: Für Minecraft 1.17 bis 1.20.4
            - **Java 21 (Internal-21)**: Für moderne Minecraft-Versionen (1.20.5+)
            
            #### Controller-Funktionen:
            - **Vollständige Gamepad-Belegung**: Springen, Schleichen, Tastatur per Taste X, Inventar, Chat, Perspektivenwechsel.
            - **Controller-Only Modus**: Sauberes Vollbild-Erlebnis ohne störende Touch-Buttons.
            - **Mods & Addons Navigation**: Installieren-Button leuchtet bei Fokus auf und lässt sich direkt mit A drücken.
            - **Menü-Navigation**: B-Taste als Zurück-Funktion, A-Taste zur Bestätigung.
            
            #### Installation:
            1. Lade `pojavlauncher-controller-debug.apk` unten herunter.
            2. Installiere die APK auf deinem Android-Gerät (bestehende Version ggf. überschreiben).
            3. Starte das Spiel – Java wird automatisch erkannt und Minecraft startet direkt!
          files: |
            out/pojavlauncher-controller-debug.apk
            out/pojavlauncher-controller-debug.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
