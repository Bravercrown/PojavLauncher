name: Android CI

on:
  pull_request:
    types: [ opened, reopened ]
  push:
    branches:
      - 'v3_openjdk'
      - 'controller-support'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          mkdir -p app_pojavlauncher/libs
          wget -q -O app_pojavlauncher/libs/ltw-release.aar https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/pojavlauncher-controller-debug.apk
          md5sum out/pojavlauncher-controller-debug.apk > out/pojavlauncher-controller-debug.md5

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pojavlauncher-controller-apk
          path: out/pojavlauncher-controller-debug.*

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v3-controller
          name: "PojavLauncher Controller Edition (APK)"
          body: |
            ### PojavLauncher Controller Edition - Android APK
            
            Automatisch generierte APK mit vollständiger Controller-Unterstützung und optimiertem Controller-Only Modus.
            
            #### Features & Änderungen:
            - **Controller-Unterstützung**: Vordefiniertes Gamepad-Mapping für Minecraft (Springen, Schleichen, Inventar, Chat, Perspektivenwechsel).
            - **Controller-Only Modus**: Touch-Buttons und Menü-Drawer werden für ein sauberes Vollbild-Erlebnis ausgeblendet.
            - **B-Button Zurück**: Im Launcher-Menü dient die B-Taste als Zurück-Funktion.
            - **Tastatur per Knopfdruck**: X-Taste öffnet die virtuelle Tastatur.
            - **Mod- & Addon-Downloader**: Direkter Download von Mod-JARs in den Profilordner.
            
            #### Installation:
            1. Lade `pojavlauncher-controller-debug.apk` unten herunter.
            2. Installiere die APK auf deinem Android-Gerät (ggf. „Aus unbekannten Quellen installieren“ erlauben).
          files: |
            out/pojavlauncher-controller-debug.apk
            out/pojavlauncher-controller-debug.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
